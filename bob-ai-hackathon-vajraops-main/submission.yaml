submission:
  title: " Cyber Fraud Network Analyzer"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Build a Bob-powered investigation tool that takes unstructured cyber fraud intelligence (transaction records, call logs,device IDs, accused names — mock inputs), extracts entities and relationships, identifies the fraud pattern type, maps the organizational hierarchy (kingpin → mule → victims), and generates an FIR-ready case brief with recommended actions.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
   Bob-powered AI ingests mock cyber-fraud data, extracts entities/relationships, classifies fraud patterns, and builds a kingpin → mule → victim network graph.
   It correlates transactions, calls, devices and identities to uncover hidden links, money trails, suspicious accounts, and key investigative leads.
   It generates an FIR-ready case brief with evidence-backed findings, risk indicators, timeline, and recommended investigative actions.

